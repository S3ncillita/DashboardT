<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telpo Acceso</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--bd:#e3e6ea;--ac:#2563eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--bd:#2a3039;--ac:#60a5fa;--bad:#f87171}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:24px;width:min(320px,90vw);display:grid;gap:12px}
h1{font-size:18px;margin:0}input,button{font:inherit;padding:9px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}#e{color:var(--bad);min-height:1em}
</style></head><body>
<form id="f"><h1>Dashboard Telpo</h1>
<input id="u" placeholder="Usuario" autocomplete="username" required autofocus>
<input id="p" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<div id="e"></div><button>Entrar</button></form>
<script>
f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:u.value,clave:p.value})});
if(r.ok)location.href='/';else e.textContent=(await r.json()).error||'Error'};
</script></body></html>
